name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build DocC site
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Generate documentation
        run: |
          swift package --allow-writing-to-directory _site \
            generate-documentation \
            --target AppAttestServer \
            --target AppAttestClient \
            --target AppAttestCore \
            --enable-experimental-combined-documentation \
            --output-path _site \
            --transform-for-static-hosting \
            --hosting-base-path swift-app-attest
      - name: Redirect site root to the documentation index
        run: |
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=/swift-app-attest/documentation/">
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
